<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Countdown</title>
<style>
  html, body { margin: 0; height: 100%; }
  body {
    display: flex; align-items: center; justify-content: center;
    background: #fff; color: #000; font-family: system-ui, sans-serif; overflow: hidden;
  }
  #t { font-size: 26vw; font-weight: 700; font-variant-numeric: tabular-nums; line-height: 1; }
</style>
</head>
<body>
<div id="t">05:00</div>
<script>
  // URL params: ?m=minutes&s=seconds (defaults to 5 minutes). Starts on load.
  var params = new URLSearchParams(location.search);
  var total = (parseInt(params.get('m')) || 0) * 60 + (parseInt(params.get('s')) || 0) || 300;
  var end = Date.now() + total * 1000;
  var timer = document.getElementById('t');

  function format(seconds) {
    var minutes = Math.floor(seconds / 60), rest = seconds % 60;
    return String(minutes).padStart(2, '0') + ':' + String(rest).padStart(2, '0');
  }
  function tick() {
    var left = Math.max(0, Math.ceil((end - Date.now()) / 1000));
    timer.textContent = format(left);
    if (left === 0) clearInterval(interval);
  }
  var interval = setInterval(tick, 250);
  tick();
</script>
</body>
</html>
